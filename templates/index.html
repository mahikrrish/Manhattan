<!doctype html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal AI Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Aptos:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Aptos', sans-serif; background-color: #f3f4f6; }
        
        /* Mic Pulsing Animation */
        .mic-container { position: relative; display: inline-flex; align-items: center; justify-content: center; }
        
        .pulse-circle {
            position: absolute; width: 45px; height: 45px;
            background-color: rgba(59, 130, 246, 0.4);
            border-radius: 50%; opacity: 0; pointer-events: none;
        }

        .listening .pulse-circle { animation: pulse 1.5s infinite; }
        .listening .pulse-circle:nth-child(2) { animation-delay: 0.5s; }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(2.8); opacity: 0; }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="h-full flex items-center justify-center p-4">

    <div class="max-w-5xl w-full glass-card p-10 rounded-3xl shadow-2xl">
        <h1 class="text-3xl font-extrabold text-gray-900 mb-8 text-center tracking-tight">AI WORKSPACE</h1>
        
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
            <div class="flex flex-col space-y-4">
                <div class="flex justify-between items-center px-1">
                    <span class="text-xs font-bold text-blue-600 uppercase">Input Engine</span>
                    <input type="file" id="fileInput" class="hidden" accept=".txt,.pdf,.docx">
                    <button onclick="document.getElementById('fileInput').click()" class="text-xs text-gray-500 hover:text-blue-500 transition-colors">
                        📎 Upload Document
                    </button>
                </div>
                
                <textarea id="inputText" class="w-full h-72 p-5 rounded-2xl border-2 border-gray-100 bg-white shadow-inner focus:border-blue-400 focus:ring-0 transition-all resize-none text-gray-800" placeholder="Type, upload a file, or click the mic to speak..."></textarea>
                
                <div class="flex items-center justify-between pt-2">
                    <div id="micWrapper" class="mic-container">
                        <div class="pulse-circle"></div>
                        <div class="pulse-circle"></div>
                        <button id="micBtn" class="bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-full shadow-lg transition-transform active:scale-95 z-10">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                            </svg>
                        </button>
                    </div>
                    
                    <button id="analyzeBtn" class="bg-indigo-600 text-white px-12 py-4 rounded-2xl font-bold tracking-widest hover:bg-indigo-700 shadow-xl transition-all">
                        ANALYZE
                    </button>
                </div>
            </div>

            <div class="flex flex-col space-y-4">
                <div class="flex justify-between items-center px-1">
                    <span class="text-xs font-bold text-indigo-600 uppercase">AI Intelligence</span>
                    <div class="flex items-center space-x-2">
                        <input type="checkbox" id="readAloud" class="w-4 h-4 rounded text-indigo-600 focus:ring-0">
                        <label for="readAloud" class="text-xs font-bold text-gray-600 uppercase">Read Aloud</label>
                    </div>
                </div>

                <div id="outputBox" class="w-full h-72 p-5 rounded-2xl bg-gray-50 border-2 border-gray-100 text-gray-700 overflow-y-auto leading-relaxed whitespace-pre-wrap shadow-inner"></div>
                
                <div class="flex justify-end pt-2">
                    <button id="copyBtn" class="text-xs font-bold text-gray-400 hover:text-indigo-600 transition-colors">
                        COPY RESULT
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const micWrapper = document.getElementById('micWrapper');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const outputBox = document.getElementById('outputBox');
        const inputText = document.getElementById('inputText');

        // 1. DIRECTIONAL FLOW: ANALYZE TRIGGER (AJAX)
        analyzeBtn.addEventListener('click', async () => {
            const content = inputText.value;
            if(!content) return;

            outputBox.innerHTML = "<p class='animate-pulse text-indigo-500'>Engine processing...</p>";

            try {
                // Flask Endpoint Call
                const response = await fetch('/process', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `text_data=${encodeURIComponent(content)}`
                });
                
                const data = await response.json();
                outputBox.innerText = data.result;

                // DIRECTIONAL FLOW: TTS OPTIONAL STEP
                if (document.getElementById('readAloud').checked) {
                    triggerSpeech(data.result);
                }
            } catch (err) {
                outputBox.innerText = "Error: System failed to reach the AI engine.";
            }
        });

        // 2. DIRECTIONAL FLOW: VOSK STT TRIGGER
        document.getElementById('micBtn').addEventListener('click', async () => {
            micWrapper.classList.toggle('listening');
            
            if (micWrapper.classList.contains('listening')) {
                // Call your future Vosk/STT route
                const response = await fetch('/stt-listen');
                const data = await response.json();
                if(data.text) {
                    inputText.value += data.text;
                    micWrapper.classList.remove('listening');
                }
            }
        });

        // 3. DIRECTIONAL FLOW: PYTTSX3 TRIGGER
        async function triggerSpeech(text) {
            await fetch('/speak', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            });
        }
        
        // File Upload Simulation (Paste to TextBox)
        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (event) => {
                inputText.value = event.target.result;
            };
            reader.readAsText(file);
        });
    </script>
</body>
</html>
