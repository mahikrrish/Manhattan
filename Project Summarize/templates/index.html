<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Summarizer</title>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aptos:wght@400;600;700&amp;display=swap" rel="stylesheet">
  <style>
    body {
      box-sizing: border-box;
      font-family: 'Aptos', system-ui, -apple-system, sans-serif;
    }
    
    .background-container {
      background-image: url('https://images.unsplash.com/photo-1511593358241-7eea1f3c84e5?q=80&w=1154&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    
    .glass-effect {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .star {
      color: #fbbf24;
      font-size: 1.25rem;
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full">
  <div class="background-container w-full h-full overflow-auto">
   <main class="min-h-full flex items-center justify-center p-6">
    <div class="w-full max-w-4xl">
     <h1 id="pageTitle" class="text-4xl font-bold text-center mb-8 text-white">Summarize Your Text</h1><!-- Text Boxes Side by Side -->
     <form action="/summarize" method="POST" id="mainForm">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
       <div>
        <label for="inputText" class="block text-lg font-semibold text-white mb-3">Input Text</label> 
        <textarea name="text_to_summarize" id="inputText" rows="12" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-purple-500 resize-none text-gray-800" placeholder="Enter or paste your text here to summarize...">{{ original_text if original_text }}</textarea>
        <div class="flex gap-3 mt-3">
         <button type="button" id="uploadBtn" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition-colors duration-200 flex items-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
          <span>Upload File</span> 
         </button> 
         <button type="button" id="clearBtn" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition-colors duration-200 flex items-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          <span>Clear</span> 
         </button>
        </div>
        <input type="file" id="fileInput" accept=".pdf,.doc,.docx,.txt" class="hidden">
       </div>
       
       <div>
        <label for="outputText" class="block text-lg font-semibold text-white mb-3">Summary</label> 
        <textarea id="outputText" rows="12" readonly class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg bg-gray-50 resize-none text-gray-800" placeholder="Summary will appear here...">{{ summary_result if summary_result }}</textarea>
        <div class="flex gap-3 mt-3">
         <button type="button" id="downloadBtn" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition-colors duration-200 flex items-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
          <span>Download Summary</span> 
         </button> 
         <button type="button" id="copyBtn" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition-colors duration-200 flex items-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
          <span>Copy</span> 
         </button>
        </div>
       </div>
      </div>
      
      <div class="flex justify-center mt-4">
       <button type="submit" id="summarizeBtn" class="px-8 py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold text-lg rounded-xl shadow-lg transition-all duration-200 transform hover:scale-105"> 
        <span>Summarize</span> 
       </button>
      </div>
     </form>
    </div>
   </main>
  </div>

  <script>
    // 1. Upload Logic
    document.getElementById('uploadBtn').addEventListener('click', () => {
      document.getElementById('fileInput').click();
    });

    document.getElementById('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const formData = new FormData();
  formData.append('file', file);

  // Send the file to Python to be "read"
  const response = await fetch('/upload', {
    method: 'POST',
    body: formData
  });

  const data = await response.json();
  if (data.text) {
    document.getElementById('inputText').value = data.text;
  } else {
    alert("Error reading file: " + data.error);
  }
});

    // 2. Clear Logic
    document.getElementById('clearBtn').addEventListener('click', () => {
      document.getElementById('inputText').value = '';
      document.getElementById('outputText').value = '';
    });

    // 3. Download Logic
    document.getElementById('downloadBtn').addEventListener('click', () => {
      const text = document.getElementById('outputText').value;
      if (!text || text.trim() === "") return;

      const blob = new Blob([text], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'summary.txt';
      a.click();
      URL.revokeObjectURL(url);
    });

    // 4. Copy Logic
    document.getElementById('copyBtn').addEventListener('click', () => {
      const text = document.getElementById('outputText').value;
      if (!text || text.trim() === "") return;

      navigator.clipboard.writeText(text).then(() => {
        const btnSpan = document.querySelector('#copyBtn span');
        const originalText = btnSpan.textContent;
        btnSpan.textContent = 'Copied!';
        setTimeout(() => {
          btnSpan.textContent = originalText;
        }, 2000);
      });
    });
  </script>
 </body>
</html>
